---
apiVersion: v1
kind: ConfigMap
metadata:
    name: mesh-server-env
data:
    TZ: "Asia/Shanghai"
    HOST: "0.0.0.0"
    PORT: "8088"
    DATA_DIR: "/data"
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128"
    MAX_AUTH_CONCURRENCY: "32"
    MAX_API_CONCURRENCY: "128"
    MAX_STATIC_CONCURRENCY: "64"

---
apiVersion: v1
kind: Secret
metadata:
    name: mesh-server-secrets
type: Opaque
stringData:
    # 管理台唯一凭证：在 /admin 登录页输入，启动时用 Argon2id 哈希后丢弃明文
    AUTH_TOKEN: "ScQZUYHUpwetgM1viWJqRQIlhHVJ6RHj"
    # 签发 Bearer 的 HMAC 密钥；轮换它等于让所有已发出的凭证失效
    SESSION_SIGNING_KEY: "ejQc2qAPOD2fT6n7KK7JONXduwFxorZ8"
    READYZ_TOKEN: "g5A89dVWQE4EcsbAl7Tyq9sxh4Ysf353"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: mesh-server-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: mesh-server
    labels:
        app: mesh-server
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: app
          # 本地构建的镜像（见 Dockerfile.runtime），不从仓库拉取。
          image: localhost/mesh-server:latest
          imagePullPolicy: Never

          securityContext:
              allowPrivilegeEscalation: false

          envFrom:
              - configMapRef:
                    name: mesh-server-env
              - secretRef:
                    name: mesh-server-secrets

          # 控制面只在 WireGuard 地址上对外提供，hostIP 把发布端口钉在 10.8.0.1；
          # 容器内仍是 0.0.0.0，探针才能从容器自己的回环地址打进来。
          ports:
              - name: http
                containerPort: 8088
                hostPort: 8088
                hostIP: 10.8.0.1
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          readinessProbe:
              httpGet:
                  path: /readyz?token=g5A89dVWQE4EcsbAl7Tyq9sxh4Ysf353
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data

    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: mesh-server-data
