---
apiVersion: v1
kind: ConfigMap
metadata:
    name: mesh-server-env
data:
    TZ: "Asia/Shanghai"
    HOST: "0.0.0.0"
    PORT: "8080"
    DATA_DIR: "/data"
    # 回环给探针，10.89.2.0/24 是 apps 网络：nginx-proxy-manager 从这里回源，
    # 只有它的地址可信，X-Forwarded-For 才会被用来记 client_ip。
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128,10.89.2.0/24"
    MAX_AUTH_CONCURRENCY: "32"
    MAX_API_CONCURRENCY: "128"
    MAX_STATIC_CONCURRENCY: "64"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: mesh-server-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: mesh-server
    labels:
        app: mesh-server
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: app
          # 本地构建的镜像（见 Dockerfile.runtime），不从仓库拉取。
          image: localhost/mesh-server:latest
          imagePullPolicy: Never

          securityContext:
              allowPrivilegeEscalation: false

          # Secret 单独存一份、不入库：k8s.mesh-server.secret.yaml 与本文件
          # 用 cat 拼成一份清单再 play。
          envFrom:
              - configMapRef:
                    name: mesh-server-env
              - secretRef:
                    name: mesh-server-secrets

          # 两条入口：
          #   容器内的 8080 —— nginx-proxy-manager 在同一个 apps 网络里按名字连，
          #   对外是 https://mesh.daveny.cn；
          #   hostPort 8088 仍钉在 10.8.0.1 —— 已经在用这个地址的 mesh 设备不用改配置。
          ports:
              - name: http
                containerPort: 8080
                hostPort: 8088
                hostIP: 10.8.0.1
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          readinessProbe:
              httpGet:
                  path: /readyz
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data

    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: mesh-server-data
