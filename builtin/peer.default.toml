# 默认 EasyTier 配置：控制面用它预填“新建设备”对话框，管理员保存后就是该设备的
# config.toml，客户端原样写盘并作为 core 的 -c 参数。
#
# 这份模板只描述网络，不含任何密钥。没有 network_secret 的节点是凭据节点：客户端
# 不传 --secure-mode，用控制面签发的 config/credential.json 走 ET_CREDENTIAL；首次
# 启动还没有凭据就先不起 core，等心跳下发后再起（心跳不依赖 core）。
# 三个种子（ali / tencent / zyf）是正式节点：配置里带 network_secret，用
# config/secure.key 的固定私钥走 --secure-mode；它们的配置单独维护、不从这份模板
# 复制，所以这里不该出现任何密钥。
#
# 也不要在这里加 [secure_mode]：客户端启动 core 时一定用 --secure-mode（配
# ET_LOCAL_PRIVATE_KEY）或 ET_CREDENTIAL 指明身份，两者都会把这一段整体覆盖，
# 配置里写的 enabled 不会生效。

# ipv4 那一行是地址占位符：新建对话框把它列成一张表单，预填一台空闲的固定地址
# （完整 CIDR，如 10.126.126.4/24），填好后落库的是裸配置。地址范围取现有设备里
# 最小那台所在的 /24，从它之后找第一个没被占用的值；改已有设备的配置时自己把地址
# 写对，控制面只当文本存取，不校验占位符也不校验地址是否重复。
# dhcp 不支持：Windows 客户端用的 mini 内核没有编译 dhcp-ipv4 特性，开着也
# 拿不到地址；EasyTier 自带的 DHCP 只按在线对端避让，会与掉线设备撞地址。
dhcp = false
ipv4 = "{{ IP }}"

# STUN 用我们自建的三个端点（ali 47.108.249.34、tencent 139.155.158.68、
# zyf 47.109.85.5，都是 udp/3478），不用上游默认的公共 STUN 列表
# （txt:stun.easytier.cn 等）；tcp 与 v6 两项显式清空，只走自建的 UDP。
# EasyTier 判定 NAT 类型要求至少两个不同的 STUN 服务器回包，只配一个时类型
# 永远是 Unknown、打洞只能盲试；这三个里至少要两个能回包，否则 NAT 类型判定
# 会退化。
stun_servers = ["47.108.249.34:3478", "139.155.158.68:3478", "47.109.85.5:3478"]
tcp_stun_servers = []
stun_servers_v6 = []

[network_identity]
# 全网一致的网络名，不同 network_name 的节点不在同一个网络里。
# 本段不写 network_secret：写了就成了正式节点，凭据节点的身份只能来自签发的凭据。
network_name = "test-net"

[flags]
# 必须全网一致：算法由每个节点自己决定“我发出去的包用什么”，对端必须能解。
# Windows 客户端用的 mini 内核同时编了 aes-gcm 与 chacha20 两个 AEAD 后端，但两端
# 写法不一致（一端 chacha20、一端 aes-gcm）就会 session invalidated，现象是“已连接”
# 但节点表里只有自己。当前全网统一用 chacha20，纯软件实现下比 AES-GCM 快。
# 等价于启动参数 --encryption-algorithm。
encryption_algorithm = "chacha20"

# 虚拟网卡名：mesh_<组网实现><序号>。名字是适配器身份的一部分（Windows 上 GUID 由
# 名字派生），每次起 core 换名字会留下残留设备，按接口名建的防火墙规则也会一组组
# 堆积——所以它固定，不跟随主机名或网络名。将来换组网实现时序号另起，两者可以并存。
# 空着则由上游按平台起名（et_1 / tun0）。
dev_name = "mesh_easytier0"

# 三级种子（ali / tencent / ali-zyf），每级都写 udp 与 tcp 两条连接目标：core 对每条
# 各自重连，udp 延迟低、能打洞，tcp 在 udp 被屏蔽或打不通时兜底。用域名而不是 IP，
# 种子换地址时不必逐台设备改配置。
[[peer]]
uri = "udp://wg0.daveny.cn:11010"
[[peer]]
uri = "tcp://wg0.daveny.cn:11010"
[[peer]]
uri = "udp://wg1.daveny.cn:11010"
[[peer]]
uri = "tcp://wg1.daveny.cn:11010"
[[peer]]
uri = "udp://wg2.daveny.cn:11010"
[[peer]]
uri = "tcp://wg2.daveny.cn:11010"
