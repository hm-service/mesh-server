name: Build and Push Docker Image

on:
    push:
        branches:
            - main
        paths-ignore:
            - "DESIGN.md"
            - "justfile"
            - "k8s.mesh-server.yaml"
            - "README.md"
            - "docs/**"
            - ".gitignore"
    workflow_dispatch:

# action 一律用 commit SHA 引用（后面注释版本 tag）：tag 可以被上游重指，
# SHA 不会。升级时用 `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` 取新值，
# 同时更新注释。
jobs:
    test-go:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: true

            # go:embed 要求编译期 frontend/dist 里有可嵌入文件
            - name: Stub frontend/dist
              run: mkdir -p frontend/dist && touch frontend/dist/STUB

            - name: gofmt
              run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "the files above are not gofmt formatted"; exit 1; }

            - name: go vet
              run: go vet ./...

            - name: go test
              run: go test ./... -count=1

    test-frontend:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: 12.23.0

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.13.1
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Install
              run: cd frontend && pnpm install --frozen-lockfile

            - name: Type check
              run: cd frontend && pnpm typecheck

    build-and-push:
        needs: [test-go, test-frontend]
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # 多架构构建时，amd64 runner 上要用 QEMU 跑 arm64 的运行时阶段（apk add）。
            # 但构建阶段本身在 $BUILDPLATFORM 上跑，不经过模拟。
            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 获取当前日期 (yyyy-MM-dd) 并强制仓库所有者名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            - name: Build and push
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: true
                  provenance: false
                  platforms: linux/amd64,linux/arm64
                  # 同时打上 latest 和 日期 tag
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/mesh-server:${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/mesh-server:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # 部署清单按 digest 引用镜像。把本次构建的 manifest list digest 写进
            # run 页面，部署时从这里取；也可在部署机上 `podman image inspect`
            # 取 `{{index .RepoDigests 0}}`。
            - name: Record image digest
              run: |
                  {
                    echo '### mesh-server image digest'
                    echo '```'
                    echo '${{ steps.build.outputs.digest }}'
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
