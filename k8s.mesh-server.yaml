---
apiVersion: v1
kind: ConfigMap
metadata:
    name: mesh-server-env
data:
    TZ: "Asia/Shanghai"
    HOST: "0.0.0.0"
    PORT: "8080"
    DATA_DIR: "/data"
    # 回环给探针，10.89.2.0/24 是 apps 网络：nginx-proxy-manager 从这里回源，
    # 只有它的地址可信，X-Forwarded-For 才会被用来记 client_ip。
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128,10.89.2.0/24"
    MAX_AUTH_CONCURRENCY: "32"
    MAX_API_CONCURRENCY: "128"
    MAX_STATIC_CONCURRENCY: "64"
    # 管理面单独监听：8080 上只有设备面与探针，/api/auth 与 /api/admin 一条都
    # 不注册。8089 由 podman 只发布到 wg 接口，公网没有这个端口。
    ADMIN_HOST: "0.0.0.0"
    ADMIN_PORT: "8089"
    # 发布下载默认只允许公网地址；包目录在 mesh 上的 10.126.126.1，单独放行。
    RELEASE_FETCH_ALLOW: "10.8.0.0/24,10.126.126.1/32"
    # 签发凭据：easytier-cli 只认 ip:port，所以控制面把宿主挂进来的 unix socket
    # 在进程内桥出一个回环端口。socket 由宿主上的 mesh-rpc.socket 创建，mesh 上的
    # 其它节点没有地址可连，同机也要有该文件的读权限。
    ET_CLI: "/usr/local/bin/easytier-cli"
    ET_RPC_SOCKET: "/run/mesh/rpc.sock"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: mesh-server-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: mesh-server
    labels:
        app: mesh-server
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: app
          # 镜像由 GitHub Actions 构建并推到 GHCR，部署机只负责拉取。
          image: ghcr.io/hm-service/mesh-server:latest
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false

          # Secret 单独存一份、不入库：k8s.mesh-server.secret.yaml 与本文件
          # 用 cat 拼成一份清单再 play。
          envFrom:
              - configMapRef:
                    name: mesh-server-env
              - secretRef:
                    name: mesh-server-secrets

          # 唯一入口：容器内的 8080 —— nginx-proxy-manager 在同一个 apps 网络里
          # 按名字连，对外是 https://mesh.daveny.cn。
          ports:
              - name: http
                containerPort: 8080
                protocol: TCP
              # 管理面只发布到 wg 地址：容器内部监听 0.0.0.0，宿主这一侧绑 10.8.0.1。
              - name: admin
                containerPort: 8089
                hostPort: 8089
                hostIP: 10.8.0.1
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          readinessProbe:
              httpGet:
                  # 探针会写数据库，必须带令牌；真值由部署时渲染，见 DESIGN.md 部署段。
                  path: /readyz?token=__READYZ_TOKEN__
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data
              # 宿主上的签发通道 socket 目录，只读挂载。
              - name: rpc-socket
                mountPath: /run/mesh
                readOnly: true

    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: mesh-server-data
        - name: rpc-socket
          hostPath:
              path: /run/mesh
              type: Directory
